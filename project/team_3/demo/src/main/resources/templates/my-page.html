<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>마이페이지</title>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <a href="https://www.naver.com" class="logo">Team3</a>
    </div>

    <nav>
        <ul>
            <li><a href="#profile">회원 정보 수정</a></li>
            <li><a href="#withdraw">회원 탈퇴</a></li>
            <li><a href="#cart">장바구니</a></li>
            <li><a href="#orders">주문 내역</a></li>
        </ul>
    </nav>

    <section id="profile">
        <h2>회원 정보 수정</h2>
        <div id="checkPassword" class="checkPassword">
            <label for="password">비밀번호를 입력하세요:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <form id="editProfile" class="editProfile">
            <label for="editPassword">비밀번호:</label>
            <input type="text" id="editPassword" name="editPassword" required>

            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">전화번호:</label>
            <input type="tel" id="phone" name="phone" required>

            <button type="submit">정보 수정</button>
        </form>
    </section>

    <section id="withdraw">
        <h2>회원 탈퇴</h2>
        <p>회원 탈퇴를 원하시면 아래 버튼을 클릭하세요.</p>
        <button>회원 탈퇴</button>
    </section>

    <section id="cart">
        <h2>장바구니</h2>
        <p>장바구니에 담긴 상품 목록이 표시됩니다.</p>
        <!-- 장바구니 내용 추가 가능 -->
    </section>

    <section id="orders">
        <h2>주문 내역</h2>
        <p>주문 내역이 표시됩니다.</p>
        <!-- 주문 내역 추가 가능 -->
    </section>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/myPage.js}"></script>
</body>
</html>
